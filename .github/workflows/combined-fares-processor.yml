name: Combined Fare Trip Processor

on:
  workflow_dispatch:
    inputs:
      input_csv:
        description: "Combined one-way fares CSV"
        required: true
        default: "data/all_fares_best_prices.csv"
      round_trips_csv:
        description: "Output CSV for 2-7 day round trips"
        required: true
        default: "archive/multi_city_tickets.csv"
      best_deals_csv:
        description: "Output CSV for best detected deals"
        required: true
        default: "archive/best_deals_detected.csv"
      previous_best_deals_csv:
        description: "Previous best deals CSV for price-change comparison"
        required: true
        default: "archive/best_deals_detected.csv"
      top_fraction:
        description: "Per route+month, keep cheapest fraction (0.2 = top 20%, 1.0 = all before max price filter)"
        required: true
        default: "0.2"
      max_total_price:
        description: "Maximum total round-trip price in PLN"
        required: true
        default: "800"

jobs:
  process:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install processor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Process combined fares into round trips
        env:
          INPUT_CSV: ${{ github.event.inputs.input_csv || 'data/all_fares_best_prices.csv' }}
          ROUND_TRIPS_CSV: ${{ github.event.inputs.round_trips_csv || 'archive/multi_city_tickets.csv' }}
          BEST_DEALS_CSV: ${{ github.event.inputs.best_deals_csv || 'archive/best_deals_detected.csv' }}
          PREVIOUS_BEST_DEALS_CSV: ${{ github.event.inputs.previous_best_deals_csv || 'archive/best_deals_detected.csv' }}
          TOP_FRACTION: ${{ github.event.inputs.top_fraction || '0.2' }}
          MAX_TOTAL_PRICE: ${{ github.event.inputs.max_total_price || '800' }}
        run: |
          python process_combined_fares.py \
            --input-csv "$INPUT_CSV" \
            --round-trips-csv "$ROUND_TRIPS_CSV" \
            --best-deals-csv "$BEST_DEALS_CSV" \
            --previous-best-deals-csv "$PREVIOUS_BEST_DEALS_CSV" \
            --top-fraction "$TOP_FRACTION" \
            --max-total-price "$MAX_TOTAL_PRICE"

      - name: Commit processed trip outputs
        env:
          ROUND_TRIPS_CSV: ${{ github.event.inputs.round_trips_csv || 'archive/multi_city_tickets.csv' }}
          BEST_DEALS_CSV: ${{ github.event.inputs.best_deals_csv || 'archive/best_deals_detected.csv' }}
        run: |
          git add "$ROUND_TRIPS_CSV" "$BEST_DEALS_CSV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update combined trip deals" || echo "No combined trip deal changes to commit"
          git push

      - name: Upload processed trip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: combined-trip-deals
          path: |
            ${{ github.event.inputs.round_trips_csv || 'archive/multi_city_tickets.csv' }}
            ${{ github.event.inputs.best_deals_csv || 'archive/best_deals_detected.csv' }}
          if-no-files-found: error
